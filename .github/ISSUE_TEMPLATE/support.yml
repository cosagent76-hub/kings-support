name: Kings Support Request
description: Ask for help with the Kings iOS app. Public requests only.
title: "Support: "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using Kings. Support requests here are public. Do not include phone numbers, home addresses, private family details, or other sensitive personal information.
        If you attach screenshots, crop or cover player names, player photos, or anything else you do not want public.
        Before submitting, open Kings and go to Settings > About Kings > Copy Support Details. Paste those details below.
        Copied support details are designed to be privacy-safe. They do not include player names, scores, game history, Apple IDs, iCloud record IDs, or scorebook names.
  - type: input
    id: app-version
    attributes:
      label: Kings app version
      description: This is included in Copy Support Details. If you cannot copy support details, write "not sure."
      placeholder: "Example: version shown in Copy Support Details"
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      description: This is included in Copy Support Details. If you cannot copy support details, write what you know.
      placeholder: "Example: iPhone 15, iOS 18"
  - type: textarea
    id: copied-support-details
    attributes:
      label: Copied support details
      description: In Kings, open Settings > About Kings > Copy Support Details, then paste the copied text here.
      placeholder: "Paste the copied Kings support details here."
  - type: dropdown
    id: area
    attributes:
      label: What do you need help with?
      options:
        - Starting or setting up a game
        - Scoring a hand
        - Scoreboard or totals
        - Game history or player stats
        - Sharing a game summary
        - iCloud scorebook sharing
        - Player photos
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Tell us what you expected, what happened instead, and any steps that repeat the issue.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Helpful details
      description: For scoring issues, include player count, hand number, wild rank, and what looked wrong. Do not include private player names or screenshots with private details visible.
